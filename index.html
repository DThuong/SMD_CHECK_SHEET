<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <link rel="icon" type="image/png" href="/src/assets/image/logo.png">

    <!-- CRITICAL: Force no cache -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    
    <!-- iOS viewport fix -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    
    <!-- iOS specific -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="format-detection" content="telephone=no" />
    <title>SMD Sheet System</title>
    <link rel="stylesheet" href="/src/index.css?v=2.0.1" />
  </head>
  <body>
    <div id="root"></div>
    <!-- <script src="https://cdn.jsdelivr.net/npm/eruda"></script> -->
     <script>
    // Detect iOS
    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
    
    if (isIOS) {
      
      // Clear any old event listeners
      document.removeEventListener('focusin', null);
      document.removeEventListener('focus', null);
      
      // Fix 1: Prevent viewport jump on input focus
      document.addEventListener('focusin', function(e) {
        const target = e.target;
        
        if (target.tagName === 'INPUT' || 
            target.tagName === 'TEXTAREA' || 
            target.tagName === 'SELECT') {
          
          // Skip checkbox and radio
          if (target.type === 'checkbox' || target.type === 'radio') {
            return;
          }
          
          // Prevent default scroll
          e.preventDefault();
          
          // Scroll input into view after keyboard animation
          setTimeout(function() {
            try {
              // Get input position
              const rect = target.getBoundingClientRect();
              const absoluteTop = window.pageYOffset + rect.top;
              
              // Scroll to input with offset
              window.scrollTo({
                top: absoluteTop - 120, // 120px from top
                behavior: 'smooth'
              });
              
              // Force focus again
              target.focus({ preventScroll: true });
            } catch (error) {
              console.error('❌ Scroll error:', error);
            }
          }, 300);
        }
      }, true); // Use capture phase
      
      // Fix 2: Lock body scroll when input focused
      document.addEventListener('focusin', function(e) {
        const target = e.target;
        if ((target.tagName === 'INPUT' || target.tagName === 'TEXTAREA') &&
            target.type !== 'checkbox' && target.type !== 'radio') {
          document.body.classList.add('input-focused');
        }
      });
      
      document.addEventListener('focusout', function() {
        document.body.classList.remove('input-focused');
      });
      
      // Fix 3: Prevent double-tap zoom
      let lastTouchEnd = 0;
      document.addEventListener('touchend', function(e) {
        const now = Date.now();
        if (now - lastTouchEnd <= 300) {
          e.preventDefault();
        }
        lastTouchEnd = now;
      }, false);
    }
  </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
