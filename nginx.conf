server {
    listen 80;
    
    root /usr/share/nginx/html;
    index index.html;

    # Không cache index.html và version.json
    location ~ ^/(index\.html|version\.json)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # React Router
    location / {
        try_files $uri $uri/ /index.html;
    }

    # File ngôn ngữ i18n: trước đây không khớp regex cache bên dưới nên 14 file JSON
    # phải tải lại qua mạng mỗi lần mở trang. Cho cache 7 ngày; khi deploy bản mới,
    # UpdateChecker đã tự phát hiện và reload nên không sợ dính bản cũ.
    location ^~ /locales/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # Cache static files (có hash trong tên nên safe)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}